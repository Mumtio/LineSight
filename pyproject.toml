[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linesight"
version = "0.1.0"
description = "Cold-start visual inspection for textile rolls: anomaly detection, ASTM D5430 scoring, and a false-alarm-budgeted threshold."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LineSight" }]

dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.9",      # contrib: cv2.aruco lives here
    "torch>=2.2",
    "timm>=1.0",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "pillow>=10.2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
report = [
    "matplotlib>=3.8",
    "reportlab>=4.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
linesight = "linesight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "probes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"probes/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs a backbone forward pass or a dataset on disk",
    "data: requires data/ to be populated by scripts/fetch_data.sh",
]
